<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title></title>
  <link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <section id="login-view" class="login-wrap" hidden>
    <div class="login-card"><div class="brand" data-i18n="brand"></div><h1 data-i18n="loginTitle"></h1><p class="muted" data-i18n="loginHelp"></p>
      <form id="login-form"><label><span data-i18n="adminKey"></span><input name="adminKey" type="password" required autocomplete="current-password" dir="ltr" maxlength="512"></label><button type="submit" class="primary" data-i18n="login"></button><p id="login-error" class="error" role="alert"></p></form>
    </div>
  </section>
  <div id="app-view" class="app-shell" hidden>
    <aside class="sidebar"><a href="#overview" class="brand" data-i18n="brand"></a><nav id="navigation"><button data-nav="overview" data-i18n="overview"></button><button data-nav="links" data-i18n="links"></button><button data-nav="visits" data-i18n="visits"></button></nav><button id="settings-open" class="text-button" data-i18n="settings"></button><button id="logout" class="logout" data-i18n="logout"></button></aside>
    <main class="workspace">
      <header class="page-header"><div><h1 id="view-title"></h1><p class="muted" data-i18n="subtitle"></p></div><button class="primary create-link" data-i18n="create"></button></header>
      <section class="panel filters-panel"><form id="analytics-filter"><div class="filter-primary"><label><span data-i18n="from"></span><input type="date" name="from"></label><label><span data-i18n="to"></span><input type="date" name="to"></label><label><span data-i18n="group"></span><select name="groupId" data-group-select data-group-mode="all"></select></label><button class="primary" data-i18n="filter"></button><button type="reset" class="secondary" data-i18n="resetFilters"></button></div><details><summary data-i18n="advancedFilters"></summary><div class="filter-advanced"><label><span data-i18n="template"></span><select name="template" data-template-select data-all="true"></select></label><label><span data-i18n="browser"></span><input name="browser" list="browser-options" maxlength="100" data-placeholder="allBrowsers"></label><label><span data-i18n="os"></span><input name="os" list="os-options" maxlength="100" data-placeholder="allSystems"></label><label><span data-i18n="country"></span><input name="country" maxlength="7" list="country-options" dir="ltr" data-placeholder="allCountries"></label><label><span data-i18n="link"></span><select name="linkId" id="visit-link-filter"></select></label><label><span data-i18n="search"></span><input name="q" type="search" maxlength="120"></label></div></details><p class="caption" id="filter-context"></p><p class="caption" data-i18n="filteredScope"></p></form></section><datalist id="browser-options"></datalist><datalist id="os-options"></datalist><datalist id="country-options"></datalist>
      <div id="stats" class="stats" aria-live="polite"></div>
      <section id="analytics-panels" class="analytics-grid" aria-live="polite"></section><section id="overview-view" class="view"><section class="panel"><div class="section-heading"><h2 data-i18n="latestLinks"></h2><button class="text-button" data-nav="links" data-i18n="allLinks"></button></div><div id="recent-links"></div></section><section class="panel"><div class="section-heading"><h2 data-i18n="latestVisits"></h2><button class="text-button" data-nav="visits" data-i18n="allVisits"></button></div><div id="recent-visits"></div></section></section>
      <section id="links-view" class="view" hidden><section class="panel"><form id="link-filter" class="toolbar"><input name="q" type="search" data-placeholder="search" maxlength="120"><select name="groupId" data-group-select data-group-mode="all"></select><button class="secondary" data-i18n="filter"></button><button type="button" id="groups-open" class="secondary" data-i18n="groups"></button></form><div id="links-table"></div><div id="links-pagination" class="pagination"></div></section></section>
      <section id="visits-view" class="view" hidden><section class="panel"><div class="toolbar"><button type="button" id="export" class="secondary" data-i18n="export"></button></div><div id="visits-table"></div><div id="visits-pagination" class="pagination"></div><p class="caption" data-i18n="exportNote"></p></section></section>
      <p class="footnote" data-i18n="retentionNote"></p>
    </main>
  </div>
  <div id="boot-status" class="boot-status" role="status" data-i18n="loading"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="create-dialog" class="editor-dialog"><div class="dialog-heading"><h2 id="editor-heading" data-i18n="create"></h2><button type="button" class="text-button close-dialog" data-i18n="close"></button></div><div class="editor-layout"><form id="create-form"><label><span data-i18n="linkTitle"></span><input name="title" required maxlength="120" data-placeholder="titlePlaceholder"></label><div class="form-grid"><label><span data-i18n="expiryHours"></span><input name="expiresInHours" type="number" value="168" required min="1" max="2160"></label><label><span data-i18n="maxUses"></span><input name="maxUses" type="number" min="1" max="1000000" data-placeholder="unlimited"></label></div><label><span data-i18n="group"></span><select name="groupId" data-group-select></select></label><label><span data-i18n="template"></span><select name="template" id="template-select" data-template-select></select></label><label><span data-i18n="pageTitle"></span><input name="pageTitle" maxlength="120"></label><label><span data-i18n="pageMessage"></span><textarea name="pageMessage" rows="3" maxlength="1000"></textarea></label><div id="company-fields" hidden><label><span data-i18n="companyName"></span><input name="companyName" maxlength="120"></label><label><span data-i18n="companyWebsite"></span><input name="companyWebsite" type="url" maxlength="2000" dir="ltr"></label><div class="form-grid"><label><span data-i18n="accentColor"></span><input name="accentColor" type="color" value="#6956d8"></label><label><span data-i18n="backgroundColor"></span><input name="backgroundColor" type="color" value="#f5f6fa"></label></div><label><span data-i18n="logo"></span><input id="company-logo" type="file" accept="image/png,image/jpeg,image/webp"><small class="caption" data-i18n="logoHelp"></small></label><div class="logo-row"><span id="logo-status" class="caption"></span><button type="button" id="remove-logo" class="text-button" data-i18n="removeLogo" hidden></button></div></div><p class="caption" data-i18n="contentHelp"></p><p id="create-error" class="error" role="alert"></p><footer class="dialog-actions"><button type="submit" class="primary" data-i18n="save"></button><button type="button" class="secondary close-dialog" data-i18n="cancel"></button></footer></form><aside class="preview-panel"><div class="section-heading"><h3 data-i18n="preview"></h3><div class="segmented"><button type="button" data-viewport="1280" aria-pressed="false" data-i18n="desktop"></button><button type="button" data-viewport="390" aria-pressed="true" data-i18n="mobile"></button></div></div><p class="caption" data-i18n="previewHelp"></p><p id="preview-status" class="caption" role="status"></p><div id="preview-stage" class="preview-stage"><iframe id="template-preview" title="" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe></div></aside></div></dialog>
  <dialog id="groups-dialog"><div class="dialog-heading"><h2 data-i18n="groups"></h2><button type="button" class="text-button close-dialog" data-i18n="close"></button></div><form id="group-form" class="toolbar"><input name="name" required maxlength="80" data-placeholder="groupName"><button class="primary" data-i18n="addGroup"></button></form><p class="caption" data-i18n="groupHelp"></p><div id="groups-list"></div><p id="groups-error" class="error" role="alert"></p></dialog>
  <dialog id="group-action-dialog"><form id="group-action-form"><div class="dialog-heading"><h2 id="group-action-title"></h2><button type="button" class="text-button close-dialog" data-i18n="close"></button></div><p id="group-action-help" class="muted"></p><label id="group-name-field"><span data-i18n="groupName"></span><input name="name" maxlength="80"></label><label id="group-move-field"><span data-i18n="group"></span><select name="groupId" data-group-select></select></label><p id="group-action-error" class="error" role="alert"></p><footer class="dialog-actions"><button class="primary" data-i18n="confirm"></button><button type="button" class="secondary close-dialog" data-i18n="cancel"></button></footer></form></dialog>
  <dialog id="settings-dialog"><div class="dialog-heading"><h2 data-i18n="settings"></h2><button type="button" class="text-button close-dialog" data-i18n="close"></button></div><form id="settings-form"><label><span data-i18n="siteName"></span><input name="brand" required maxlength="80"></label><div class="form-grid"><label><span data-i18n="appearance"></span><select name="theme"><option value="system" data-i18n="system"></option><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select></label><label><span data-i18n="timezone"></span><input name="timezone" required list="timezone-options" maxlength="100" dir="ltr"></label></div><datalist id="timezone-options"><option value="UTC"></option><option value="Asia/Riyadh"></option><option value="Asia/Aden"></option><option value="Asia/Dubai"></option><option value="Europe/London"></option><option value="America/New_York"></option></datalist><p class="caption" data-i18n="timezoneHelp"></p><h3 data-i18n="defaults"></h3><label><span data-i18n="defaultTemplate"></span><select name="defaultTemplate" data-template-select></select></label><div class="form-grid"><label><span data-i18n="defaultExpiryHours"></span><input name="defaultExpiryHours" type="number" min="1" max="2160" required></label><label><span data-i18n="defaultMaxUses"></span><input name="defaultMaxUses" type="number" min="1" max="1000000" data-placeholder="unlimited"></label></div><label><span data-i18n="retentionDays"></span><input name="retentionDays" type="number" required min="1" max="30"></label><p class="caption" data-i18n="retentionHelp"></p><p id="settings-error" class="error" role="alert"></p><button class="primary" data-i18n="save"></button></form><section class="security-section"><h3 data-i18n="security"></h3><p class="caption" data-i18n="keyHelp"></p><form id="rotate-form"><label><span data-i18n="currentKey"></span><input name="currentKey" type="password" required maxlength="512" autocomplete="current-password" dir="ltr"></label><label><span data-i18n="newKey"></span><input name="newKey" type="password" required minlength="32" maxlength="512" autocomplete="new-password" dir="ltr"></label><p id="security-error" class="error" role="alert"></p><button class="secondary" data-i18n="rotateKey"></button></form><p class="caption" data-i18n="confirmRevoke"></p><button type="button" id="revoke-sessions" class="secondary" data-i18n="revokeSessions"></button></section></dialog>
  <dialog id="details-dialog"><div class="dialog-heading"><h2 id="detail-title" data-i18n="visitDetails"></h2><button type="button" class="text-button close-dialog" data-i18n="close"></button></div><div id="detail-content"></div></dialog>
  <dialog id="delete-dialog"><form id="delete-form"><h2 data-i18n="removeTitle"></h2><p class="muted" data-i18n="removeHelp"></p><footer class="dialog-actions"><button class="danger" data-i18n="remove"></button><button type="button" class="secondary close-dialog" data-i18n="cancel"></button></footer></form></dialog>
</body></html>
